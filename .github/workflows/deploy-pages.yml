name: Deploy MitoRestorer v3.0 Zero-Build Showpiece to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MitoRestorer repository
        uses: actions/checkout@v4

      - name: Run 30-Check Automated Biophysical & Structural Verification Suite
        run: python3 tests/run_all_verifications.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Zero-Build Static Showpiece Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
