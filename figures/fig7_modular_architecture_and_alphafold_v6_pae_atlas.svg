    <text x="588" y="194" fill="#0f172a">Q868N5 Apis Vitellogenin (1770aa, Mod 3)</text>
    <rect x="835" y="183" width="170" height="12" rx="3" fill="#059669"/>
    <text x="1010" y="193" fill="#065f46" font-weight="bold">84.8 pLDDT (3 Domains)</text>

