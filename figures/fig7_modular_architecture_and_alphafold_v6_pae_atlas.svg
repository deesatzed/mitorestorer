  <text x="44" y="348" fill="#4338ca" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">C. PAE RIGID DOMAIN ARCHITECTURE vs. INTRINSIC DISORDER MAP (AFDB v6)</text>
