name: Weekly Science Radar Digest & ODE Benchmark Refresh

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-science-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MitoRestorer repository
        uses: actions/checkout@v4

      - name: Run Weekly EuropePMC Science Radar Digest & ODE Evaluator
        run: python3 simulator/assess_new_science_release.py --weekly-digest

      - name: Run 30-Check Automated Verification Suite
        run: python3 tests/run_all_verifications.py

      - name: Commit & Push Updated Weekly Science Radar Feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/weekly_science_radar_feed.json
          if git diff --staged --quiet; then
            echo "No changes in weekly_science_radar_feed.json"
          else
            git commit -m "chore(radar): automated weekly EuropePMC science digest refresh"
            git push origin HEAD:main
          fi
